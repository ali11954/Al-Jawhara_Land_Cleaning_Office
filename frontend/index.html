<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجوهرة للنظافة - نظام إدارة شركة النظافة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/spa/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #3b82f6;
            --success: #16a34a; --danger: #dc2626; --warning: #f59e0b;
            --bg: #f0f2f5; --card: #ffffff; --border: #e5e7eb;
            --text: #1a1a2e; --text-secondary: #6b7280;
            --shadow: 0 1px 3px rgba(0,0,0,.1); --shadow-lg: 0 4px 12px rgba(0,0,0,.15);
            --radius: 10px; --radius-sm: 6px;
        }
        /* Login Page */
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); }
        .login-card { background: #fff; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center; }
        .login-card h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; font-weight: 700; }
        .login-card .subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: .95rem; }
        .login-card .logo { font-size: 3rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: .9rem; color: var(--text); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 1rem; font-family: inherit; transition: border .2s; background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary); background: #fff;
        }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: var(--radius-sm);
            font-size: .95rem; font-family: inherit; font-weight: 500; cursor: pointer; transition: all .2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 6px 12px; font-size: .85rem; }
        .btn-block { width: 100%; justify-content: center; }
        .login-btn { margin-top: 8px; padding: 14px; font-size: 1.05rem; font-weight: 600; }
        .login-error { color: var(--danger); margin-top: 12px; font-size: .9rem; display: none; }

        /* App Layout */
        .app-layout { display: none; }
        .app-layout.active { display: block; }

        /* Top Navbar */
        .topnav { background: #1e3a5f; color: #fff; padding: 0 24px; display: flex; align-items: center; height: 56px; position: sticky; top: 0; z-index: 100; }
        .topnav-brand { font-size: 1.1rem; font-weight: 700; white-space: nowrap; margin-left: 24px; }
        .topnav-links { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
        .topnav-links a { color: rgba(255,255,255,.75); padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: .85rem; white-space: nowrap; transition: all .2s; }
        .topnav-links a:hover, .topnav-links a.active { background: rgba(255,255,255,.15); color: #fff; }
        .topnav-user { display: flex; align-items: center; gap: 12px; white-space: nowrap; margin-right: auto; }
        .topnav-user span { font-size: .85rem; opacity: .8; }
        .hamburger { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 8px; }

        /* Main Content */
        .main-content { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-header h2 { font-size: 1.5rem; font-weight: 700; color: var(--text); }

        /* Cards */
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .card-header h3 { font-size: 1.1rem; font-weight: 600; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border-right: 4px solid var(--primary); }
        .stat-card.success { border-right-color: var(--success); }
        .stat-card.warning { border-right-color: var(--warning); }
        .stat-card.danger { border-right-color: var(--danger); }
        .stat-card .label { font-size: .85rem; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--text); }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 600; color: var(--text-secondary); font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; }
        tr:hover { background: #f8fafc; }
        .actions { display: flex; gap: 6px; }

        /* Badges */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-secondary { background: #f3f4f6; color: #374151; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: var(--radius); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 1.1rem; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); padding: 4px; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-start; gap: 8px; }

        /* Alert */
        .alert { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: var(--radius-sm);
            font-weight: 500; z-index: 300; animation: slideDown .3s; min-width: 300px; text-align: center; box-shadow: var(--shadow-lg); }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-box { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
        .chart-box h3 { font-size: 1rem; margin-bottom: 12px; color: var(--text-secondary); }

        /* Score colors */
        .score-excellent { color: var(--success); font-weight: 700; }
        .score-good { color: var(--primary); font-weight: 700; }
        .score-average { color: var(--warning); font-weight: 700; }
        .score-poor { color: var(--danger); font-weight: 700; }

        /* Responsive */
        @media (max-width: 768px) {
            .topnav { padding: 0 12px; }
            .hamburger { display: block; }
            .topnav-links { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #1e3a5f; flex-direction: column; padding: 8px; }
            .topnav-links.open { display: flex; }
            .topnav-links a { padding: 12px 16px; }
            .main-content { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .modal { margin: 16px; max-width: calc(100vw - 32px); }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-page" id="loginPage">
        <div class="login-card">
            <div class="logo">💎</div>
            <h1>الجوهرة للنظافة</h1>
            <p class="subtitle">نظام إدارة شركة النظافة</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUsername" name="username" placeholder="أدخل اسم المستخدم" required autofocus>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" name="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="button" class="btn btn-primary login-btn btn-block" onclick="handleLogin()">تسجيل الدخول</button>
            </form>
            <div class="login-error" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
        </div>
    </div>

    <!-- App Layout -->
    <div class="app-layout" id="appLayout">
        <!-- Top Navbar -->
        <nav class="topnav">
            <div class="topnav-brand">💎 الجوهرة</div>
            <button class="hamburger" id="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
            <div class="topnav-links" id="navLinks">
                <a href="#" onclick="navigate('dashboard')" data-page="dashboard">الرئيسية</a>
                <a href="#" onclick="navigate('employees')" data-page="employees">الموظفون</a>
                <a href="#" onclick="navigate('attendance')" data-page="attendance">الحضور</a>
                <a href="#" onclick="navigate('evaluations')" data-page="evaluations">التقييمات</a>
                <a href="#" onclick="navigate('companies')" data-page="companies">الشركات</a>
                <a href="#" onclick="navigate('salaries')" data-page="salaries">الرواتب</a>
                <a href="#" onclick="navigate('contracts')" data-page="contracts">العقود</a>
                <a href="#" onclick="navigate('invoices')" data-page="invoices">الفواتير</a>
                <a href="#" onclick="navigate('suppliers')" data-page="suppliers">الموردون</a>
                <a href="#" onclick="navigate('supplierInvoices')" data-page="supplierInvoices">فواتير الموردين</a>
                <a href="#" onclick="navigate('accounts')" data-page="accounts">الحسابات</a>
                <a href="#" onclick="navigate('journal')" data-page="journal">القيود</a>
                <a href="#" onclick="navigate('loans')" data-page="loans">القروض</a>
                <a href="#" onclick="navigate('penalties')" data-page="penalties">الخصومات</a>
                <a href="#" onclick="navigate('overtime')" data-page="overtime">العمل الإضافي</a>
                <a href="#" onclick="navigate('users')" data-page="users">المستخدمون</a>
                <a href="#" onclick="navigate('reports')" data-page="reports">التقارير</a>
                <a href="#" onclick="navigate('settings')" data-page="settings">الإعدادات</a>
            </div>
            <div class="topnav-user">
                <span id="userDisplay"></span>
                <a href="/auth/logout" class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)">خروج</a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <div id="pageContent"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Alert -->
    <div id="alertBox" class="alert" style="display:none"></div>

    <script src="/static/spa/app.js"></script>
</body>
</html>

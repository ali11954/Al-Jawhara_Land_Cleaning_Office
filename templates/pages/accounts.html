{% extends "base.html" %}
{% block title %}دليل الحسابات - ارض الجوهرة لخدمات النظافة{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-book" style="color:#16a34a;"></i> دليل الحسابات</h4>
    <button class="btn btn-success" onclick="showModal('addAccountModal')"><i class="fas fa-plus"></i> إضافة حساب</button>
</div>
<div class="row mb-4">
    <div class="col-md-4"><div class="card text-center"><div class="card-body"><h5 class="text-success" id="totalDebit">0</h5><small>إجمالي المدين</small></div></div></div>
    <div class="col-md-4"><div class="card text-center"><div class="card-body"><h5 class="text-danger" id="totalCredit">0</h5><small>إجمالي الدائن</small></div></div></div>
    <div class="col-md-4"><div class="card text-center"><div class="card-body"><h5 class="text-primary" id="totalBalance">0</h5><small>صافي الرصيد</small></div></div></div>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>رقم الحساب</th><th>اسم الحساب</th><th>النوع</th><th>الرصيد</th><th>إجراءات</th></tr></thead>
                <tbody id="accountsTable"><tr><td colspan="5" class="text-center text-muted">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/accounts');
        const data = await res.json();
        const tbody = document.getElementById('accountsTable');
        if (data.success && data.data.length) {
            tbody.innerHTML = data.data.map(a => `<tr>
                <td>${a.code || ''}</td><td>${a.name || ''}</td>
                <td><span class="badge bg-${a.type === 'asset' ? 'success' : a.type === 'liability' ? 'danger' : 'primary'}">${a.type || ''}</span></td>
                <td>${a.balance || 0}</td>
                <td><button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button></td>
            </tr>`).join('');
        } else { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">لا يوجد حسابات</td></tr>'; }
    } catch(e) { document.getElementById('accountsTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">خطأ في تحميل البيانات</td></tr>'; }
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}الشركات - ارض الجوهرة لخدمات النظافة{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-building" style="color:#16a34a;"></i> إدارة الشركات</h4>
    <button class="btn btn-success" onclick="showModal('addCompanyModal')"><i class="fas fa-plus"></i> إضافة شركة</button>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>اسم الشركة</th><th>العنوان</th><th>الهاتف</th><th>المنطقة</th><th>إجراءات</th></tr></thead>
                <tbody id="companiesTable"><tr><td colspan="5" class="text-center text-muted">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/companies');
        const data = await res.json();
        const tbody = document.getElementById('companiesTable');
        if (data.success && data.data.length) {
            tbody.innerHTML = data.data.map(c => `<tr>
                <td>${c.name || ''}</td><td>${c.address || '-'}</td>
                <td>${c.phone || '-'}</td><td>${c.region_name || '-'}</td>
                <td><button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button></td>
            </tr>`).join('');
        } else { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">لا يوجد بيانات</td></tr>'; }
    } catch(e) { document.getElementById('companiesTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">خطأ في تحميل البيانات</td></tr>'; }
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}الفواتير - ارض الجوهرة لخدمات النظافة{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-file-invoice-dollar" style="color:#16a34a;"></i> إدارة الفواتير</h4>
    <button class="btn btn-success" onclick="showModal('addInvoiceModal')"><i class="fas fa-plus"></i> إضافة فاتورة</button>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>رقم الفاتورة</th><th>الشركة</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                <tbody id="invoicesTable"><tr><td colspan="6" class="text-center text-muted">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/invoices');
        const data = await res.json();
        const tbody = document.getElementById('invoicesTable');
        if (data.success && data.data.length) {
            tbody.innerHTML = data.data.map(i => `<tr>
                <td>${i.invoice_number || ''}</td><td>${i.company_name || ''}</td>
                <td>${i.date || ''}</td><td>${i.total_amount || 0}</td>
                <td><span class="badge bg-${i.is_received ? 'success' : 'warning'}">${i.is_received ? 'مستلمة' : 'قيد الانتظار'}</span></td>
                <td><button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button></td>
            </tr>`).join('');
        } else { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">لا يوجد بيانات</td></tr>'; }
    } catch(e) { document.getElementById('invoicesTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger">خطأ في تحميل البيانات</td></tr>'; }
});
</script>
{% endblock %}

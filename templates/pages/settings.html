{% extends "base.html" %}
{% block title %}الإعدادات - ارض الجوهرة لخدمات النظافة{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-cogs" style="color:#16a34a;"></i> إعدادات النظام</h4>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="fas fa-building"></i> معلومات الشركة</h5></div>
            <div class="card-body">
                <form id="companyForm">
                    <div class="mb-3"><label class="form-label">اسم الشركة</label><input type="text" class="form-control" value="ارض الجوهرة لخدمات النظافة"></div>
                    <div class="mb-3"><label class="form-label">العنوان</label><input type="text" class="form-control" value="الجمهورية اليمنية - محافظة الحديدة"></div>
                    <div class="mb-3"><label class="form-label">الهاتف</label><input type="text" class="form-control" value=""></div>
                    <button type="submit" class="btn btn-success">حفظ التغييرات</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="fas fa-users-cog"></i> إدارة المستخدمين</h5></div>
            <div class="card-body">
                <a href="{{ url_for('auth.users_list') }}" class="btn btn-outline-success btn-block mb-2"><i class="fas fa-list"></i> عرض المستخدمين</a>
                <a href="{{ url_for('auth.add_user') }}" class="btn btn-outline-primary btn-block mb-2"><i class="fas fa-plus"></i> إضافة مستخدم</a>
                <hr>
                <h6>الأدوار المتاحة:</h6>
                <span class="badge bg-danger me-1">مدير النظام</span>
                <span class="badge bg-warning me-1">مشرف</span>
                <span class="badge bg-info me-1">موظف مالي</span>
                <span class="badge bg-secondary me-1">مشاهد</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
